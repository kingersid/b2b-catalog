<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0e" />
<meta name="description" content="Chandni Silk Mills — price catalog: browse designs one at a time, each with its price." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Chandni Silk Mills — Price Catalog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1117'/><text x='50' y='68' font-size='46' text-anchor='middle' fill='%2334d399' font-family='Arial' font-weight='bold'>CS</text></svg>">
<style>
  :root {
    --bg: #0b0b0e;
    --accent: #34d399;
    --accent-2: #f5c451;
    --text: #eef2f7;
    --muted: #9aa7b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-y: none;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ---------- Full-screen slides ---------- */
  .slide {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: grid;
    place-items: center;
    content-visibility: auto;
    contain-intrinsic-size: 0 100dvh;
    background:
      radial-gradient(140% 90% at 85% -10%, rgba(52, 211, 153, 0.07), transparent 55%),
      radial-gradient(120% 80% at 0% 110%, rgba(245, 196, 81, 0.05), transparent 50%),
      var(--bg);
  }
  .slide::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.42));
    pointer-events: none;
  }
  .media {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  /* Placeholder / background blur */
  .media .ph {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(18px) saturate(1.25);
    transform: scale(1.1);
    opacity: 1;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 1;
  }
  /* Full image */
  .media .full {
    position: relative;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  .media.ready .ph { opacity: 0; }
  .media.ready .full { opacity: 1; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .pill {
    background: rgba(10, 10, 14, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .pill .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    margin-right: 7px;
    vertical-align: 1px;
  }
  .pill.muted { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  a.pill { text-decoration: none; color: var(--muted); transition: color 0.15s, border-color 0.15s; }
  a.pill:hover { color: var(--accent); border-color: rgba(52, 211, 153, 0.4); }

  /* ---------- Right rail: arrows + progress ---------- */
  .rail {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: calc(env(safe-area-inset-top, 0px) + 6px) 0 calc(env(safe-area-inset-bottom, 0px) + 6px);
  }
  .rail button {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(10, 10, 14, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    opacity: 0.85;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: opacity 0.15s, transform 0.15s, background 0.15s;
    touch-action: manipulation;
  }
  .rail button:hover { opacity: 1; transform: scale(1.08); background: rgba(52, 211, 153, 0.85); color: #08120d; }
  .rail button:active { transform: scale(0.94); }
  .track {
    width: 3px;
    height: 30vh;
    background: rgba(255,255,255,0.16);
    border-radius: 99px;
    position: relative;
    overflow: hidden;
  }
  .thumb {
    position: absolute;
    left: 0;
    width: 100%;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    border-radius: 99px;
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.55);
    transition: top 0.2s ease, height 0.2s ease;
  }

  /* ---------- Scroll hint ---------- */
  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translateX(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.85);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }
  .hint.faded { opacity: 0; transform: translateX(-50%) translateY(14px); }
  .hint .chevron {
    width: 26px; height: 26px;
    border-right: 3px solid var(--accent);
    border-bottom: 3px solid var(--accent);
    transform: rotate(45deg);
    animation: bounce 1.6s ease-in-out infinite;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }
  @keyframes bounce {
    0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 1; }
    50%      { transform: rotate(45deg) translate(6px, 6px); opacity: 0.55; }
  }

  /* ---------- Caption ---------- */
  .caption {
    position: fixed;
    left: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    z-index: 60;
    max-width: 72%;
    background: rgba(10, 10, 14, 0.66);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    touch-action: manipulation;
  }
  .caption:empty { display: none; }
  .caption:hover { border-color: rgba(52, 211, 153, 0.4); color: var(--text); }

  /* ---------- Price pill ---------- */
  .price-pill {
    position: absolute;
    right: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 52px);
    z-index: 5;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    background: rgba(10, 10, 14, 0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(245, 196, 81, 0.55);
    color: var(--accent-2);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
    padding: 8px 16px;
    border-radius: 999px;
    pointer-events: none;
    box-shadow: 0 6px 22px rgba(0,0,0,0.45);
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }
  .price-pill .rs { font-size: 13px; font-weight: 700; opacity: 0.85; }
  .price-pill.empty {
    border-color: rgba(255,255,255,0.2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-shadow: none;
  }

  /* ---------- WhatsApp CTA ---------- */
  .wa-cta {
    position: fixed;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    z-index: 80;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 13px 18px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
    touch-action: manipulation;
  }
  .wa-cta:hover { filter: brightness(1.08); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
    transform: translateX(-50%) translateY(70px);
    background: #10161f;
    border: 1px solid rgba(52, 211, 153, 0.6);
    color: var(--accent);
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 88vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Loading state ---------- */
  .loading-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    transition: opacity 0.4s ease;
  }
  .loading-screen.done { opacity: 0; pointer-events: none; }
  .loading-screen .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Responsive: tablet ---------- */
  @media (max-width: 768px) {
    .rail { right: 6px; gap: 10px; }
    .rail button { width: 36px; height: 36px; font-size: 16px; }
    .track { height: 24vh; }
    .topbar { padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 0; }
    .topbar .pill { padding: 6px 10px; font-size: 11px; }
    .price-pill { font-size: 18px; padding: 6px 14px; right: 10px; }
    .price-pill .rs { font-size: 11px; }
    .caption { max-width: 68%; font-size: 10.5px; padding: 6px 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
    .wa-cta { padding: 10px 14px; font-size: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  }

  /* ---------- Responsive: small phone ---------- */
  @media (max-width: 420px) {
    .rail { right: 4px; gap: 8px; }
    .rail button { width: 32px; height: 32px; font-size: 14px; }
    .track { height: 20vh; }
    .price-pill { font-size: 16px; padding: 5px 12px; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 44px); }
    .price-pill .rs { font-size: 10px; }
    .price-pill.empty { font-size: 11px; padding: 4px 10px; }
    .topbar .pill { padding: 5px 8px; font-size: 10px; }
    .caption { max-width: 62%; font-size: 9.5px; padding: 5px 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: 8px; }
    .wa-cta { padding: 8px 12px; font-size: 11px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); right: 8px; }
    .hint { font-size: 9px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  }

  /* ---------- Responsive: landscape phone ---------- */
  @media (max-height: 480px) and (orientation: landscape) {
    .topbar .pill { padding: 4px 8px; font-size: 10px; }
    .price-pill { top: calc(env(safe-area-inset-top, 0px) + 44px); font-size: 16px; padding: 4px 12px; }
    .price-pill .rs { font-size: 10px; }
    .rail button { width: 30px; height: 30px; font-size: 13px; }
    .track { height: 22vh; }
    .caption { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); font-size: 9px; }
    .wa-cta { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); padding: 6px 10px; font-size: 10px; }
  }
</style>
</head>
<body>

<div class="loading-screen" id="loading"><div class="spinner"></div></div>
<div id="feed"></div>

<header class="topbar">
  <div class="pill"><span class="dot"></span>Chandni Silk Mills</div>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="pill" href="index.html">&larr; Full catalog</a>
    <div class="pill muted" id="counter">&mdash;</div>
  </div>
</header>

<nav class="rail" aria-label="Scroll controls">
  <button id="btn-up" aria-label="Previous item">&uarr;</button>
  <div class="track"><div class="thumb" id="thumb"></div></div>
  <button id="btn-down" aria-label="Next item">&darr;</button>
</nav>

<div class="hint" id="hint">
  <span class="chevron"></span>
  Scroll to explore
</div>

<div class="caption" id="caption"></div>
<div id="toast"></div>
<a class="wa-cta" id="wa-cta" href="#" target="_blank" rel="noopener">💬&nbsp; Enquire on WhatsApp</a>

<noscript><p style="color:#fff;padding:40px;text-align:center">This catalog feed needs JavaScript enabled.</p></noscript>

<script>
(async () => {
  const ORIGIN = location.protocol === "file:" ? "https://chandni-catalog.pages.dev" : location.origin;
  const WA_NUMBER = "919537097267";
  const PAGE_SIZE = 36;      // API page size (fetch in bulk)
  const INITIAL_BATCH = 12;  // render fewer slides on first paint for speed

  // --- DOM refs ---
  const $feed     = document.getElementById("feed");
  const $loading  = document.getElementById("loading");
  const $counter  = document.getElementById("counter");
  const $thumb    = document.getElementById("thumb");
  const $hint     = document.getElementById("hint");
  const $caption  = document.getElementById("caption");
  const $toast    = document.getElementById("toast");
  const $waCta    = document.getElementById("wa-cta");
  const $btnUp    = document.getElementById("btn-up");
  const $btnDown  = document.getElementById("btn-down");

  // --- State ---
  const designs   = [];      // { design_id, name, url, midUrl, webpUrl }
  const prices    = {};      // stem -> ₹ price (number)
  const slideEls  = [];      // parallel array of DOM slide elements
  let activeIdx   = 0;       // currently visible slide index (0 = first design)
  let totalDesigns = 0;
  let allLoaded   = false;

  // --- Helpers ---
  const stem = (name) => name.replace(/\.[^.]+$/, "").toLowerCase();
  const formatINR = (n) => Number(n).toLocaleString("en-IN");
  const maxScroll = () => document.documentElement.scrollHeight - window.innerHeight;

  function showToast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => $toast.classList.remove("show"), 2000);
  }

  // --- Fetch all designs from D1 (paginated) ---
  async function fetchDesigns() {
    let page = 1;
    do {
      const r = await fetch(`${ORIGIN}/api/designs?format=pages&limit=${PAGE_SIZE}&page=${page}`);
      if (!r.ok) throw new Error(`designs fetch ${r.status}`);
      const d = await r.json();
      for (const item of (d.designs || [])) designs.push(item);
      totalDesigns = d.total || designs.length;
      page++;
      if (designs.length >= totalDesigns) break;
    } while (page < 50);
  }

  // --- Fetch all prices from D1 ---
  async function fetchPrices() {
    try {
      const r = await fetch(`${ORIGIN}/prices`);
      if (!r.ok) return;
      const d = await r.json();
      Object.assign(prices, d.prices || {});
    } catch (_) { /* API unavailable — slides will show "Price on request" */ }
  }

  // --- Build a single slide element ---
  function buildSlide(design, index) {
    const section = document.createElement("section");
    section.className = "slide";
    section.dataset.index = index;
    section.dataset.item = stem(design.name);

    const media = document.createElement("div");
    media.className = "media";

    // Placeholder: blurred low-res, shown immediately via CSS filter
    const phImg = document.createElement("img");
    phImg.className = "ph";
    phImg.src = design.url;
    phImg.alt = "";
    phImg.setAttribute("aria-hidden", "true");
    phImg.decoding = "async";

    // Full image: mid-size webp for quality + speed
    const fullImg = document.createElement("img");
    fullImg.className = "full";
    fullImg.alt = design.name;
    fullImg.decoding = "async";
    // Lazy-load off-screen images; first 3 are eager for instant first paint
    if (index < 3) {
      fullImg.src = design.midUrl || design.url;
      if (index === 0) fullImg.setAttribute("fetchpriority", "high");
    } else {
      fullImg.setAttribute("loading", "lazy");
      fullImg.dataset.src = design.midUrl || design.url;
    }

    // Reveal full image once loaded (replaces blurred placeholder)
    const markReady = () => {
      if (!media.classList.contains("ready")) media.classList.add("ready");
    };
    if (fullImg.complete && fullImg.naturalWidth > 0) {
      markReady();
    } else {
      fullImg.addEventListener("load", markReady, { once: true });
      fullImg.addEventListener("error", () => {
        // If mid-size fails, fall back to original URL
        if (fullImg.src !== design.url) fullImg.src = design.url;
        else markReady(); // show whatever loaded
      }, { once: true });
      // Safety net: force reveal after 4s even if load event never fires
      setTimeout(markReady, 4000);
    }

    media.appendChild(phImg);
    media.appendChild(fullImg);
    section.appendChild(media);

    // Price pill
    const pill = document.createElement("span");
    pill.className = "price-pill";
    const p = prices[stem(design.name)];
    if (p != null) {
      pill.innerHTML = '<span class="rs">₹</span> ' + formatINR(p);
    } else {
      pill.classList.add("empty");
      pill.textContent = "Price on request";
    }
    section.appendChild(pill);

    return section;
  }

  // --- Render a batch of slides ---
  function renderBatch(startIdx, count) {
    const frag = document.createDocumentFragment();
    const end = Math.min(startIdx + count, designs.length);
    for (let i = startIdx; i < end; i++) {
      const slide = buildSlide(designs[i], i);
      slideEls.push(slide);
      frag.appendChild(slide);
    }
    $feed.appendChild(frag);
    // Observe new slides for active tracking
    for (let i = startIdx; i < end; i++) slideIO.observe(slideEls[i]);
  }

  // --- Infinite scroll via sentinel ---
  function setupSentinel() {
    const sentinel = document.createElement("div");
    sentinel.style.height = "1px";
    $feed.parentNode.insertBefore(sentinel, $feed.nextSibling);
    const obs = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !allLoaded) loadMore();
    }, { rootMargin: "800px" });
    obs.observe(sentinel);
  }

  async function loadMore() {
    if (slideEls.length >= designs.length) { allLoaded = true; return; }
    renderBatch(slideEls.length, PAGE_SIZE);
    if (slideEls.length >= designs.length) allLoaded = true;
  }

  // --- Active slide tracking via IntersectionObserver ---
  const slideIO = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) {
        const idx = slideEls.indexOf(e.target);
        if (idx !== -1 && idx !== activeIdx) {
          activeIdx = idx;
          onSlideChange();
        }
      }
    }
  }, { threshold: 0.5 });

  // --- Slide change handler ---
  function onSlideChange() {
    // Counter
    if (activeIdx === 0) {
      $counter.textContent = totalDesigns + " items";
    } else {
      $counter.textContent = activeIdx + " / " + (totalDesigns - 1);
    }
    // Progress thumb
    const count = slideEls.length;
    const pct = count > 1 ? (activeIdx / (count - 1)) * 100 : 0;
    const h = 100 / count;
    $thumb.style.top = (pct * (100 - h) / 100) + "%";
    $thumb.style.height = h + "%";
    // Hide scroll hint
    $hint.classList.add("faded");
    // Caption
    $caption.textContent = activeIdx > 0 ? "Tap to copy link" : "";
    // WhatsApp CTA
    updateCta();
    // Preload neighbors
    preloadNear(activeIdx);
  }

  // --- Preload adjacent slides ---    const preloaded = new Set();
  function preloadNear(idx) {
    // Preload 2 ahead + 1 behind for smooth scrolling
    for (const j of [idx - 1, idx + 1, idx + 2, idx + 3]) {
      if (j < 0 || j >= designs.length || preloaded.has(j)) continue;
      preloaded.add(j);
      const slide = slideEls[j];
      if (!slide) continue;
      // If the full image hasn't started loading yet, kick it off now
      const fullImg = slide.querySelector("img.full");
      if (fullImg && !fullImg.src && fullImg.dataset.src) {
        fullImg.src = fullImg.dataset.src;
        delete fullImg.dataset.src;
      }
    }
  }

  // --- WhatsApp CTA ---
  function updateCta() {
    if (activeIdx <= 0 || activeIdx >= slideEls.length) {
      $waCta.href = "#";
      return;
    }
    const design = designs[activeIdx];
    if (!design) return;
    const s = stem(design.name);
    const p = prices[s];
    const priceTxt = p != null ? " (₹" + formatINR(p) + ")" : "";
    const shareLink = ORIGIN + "/share?item=" + encodeURIComponent(s);
    const msg = encodeURIComponent(
      "Hi Chandni Silk Mills! 👋 I saw design " + s + priceTxt +
      " and I'd like to enquire about it." +
      "\n\n" + shareLink
    );
    $waCta.href = "https://wa.me/" + WA_NUMBER + "?text=" + msg;
  }

  // --- Navigation ---
  function gotoSlide(i) {
    const el = slideEls[i];
    if (el) window.scrollTo({ top: el.offsetTop, behavior: "smooth" });
  }

  $btnUp.addEventListener("click", () => {
    activeIdx > 0 ? gotoSlide(activeIdx - 1) : wrapLoop("down");
  });
  $btnDown.addEventListener("click", () => {
    activeIdx < slideEls.length - 1 ? gotoSlide(activeIdx + 1) : wrapLoop("up");
  });

  // --- Endless loop (wrap at top/bottom) ---
  let lastWrap = 0;
  function wrapLoop(dir) {
    const now = Date.now();
    if (now - lastWrap < 800) return;
    lastWrap = now;
    window.scrollTo({ top: dir === "up" ? 0 : maxScroll(), behavior: "smooth" });
  }

  // Touch wrap
  let touchStartY = null, touchStartTop = 0;
  document.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
    touchStartTop = window.scrollY;
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (touchStartY === null) return;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (dy > 50 && touchStartTop <= 60) wrapLoop("down");
    else if (dy < -50 && touchStartTop >= maxScroll() - 60) wrapLoop("up");
    touchStartY = null;
  }, { passive: true });

  // Wheel wrap
  window.addEventListener("wheel", (e) => {
    const top = window.scrollY;
    if (e.deltaY < -30 && top <= 2) { e.preventDefault(); wrapLoop("down"); }
    else if (e.deltaY > 30 && top >= maxScroll() - 2) { e.preventDefault(); wrapLoop("up"); }
  }, { passive: false });

  // Keyboard navigation
  window.addEventListener("keydown", (e) => {
    if (e.target && e.target.closest && e.target.closest("button, a, input, textarea")) return;
    const top = window.scrollY;
    if ((e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") && top >= maxScroll() - 2) {
      e.preventDefault(); wrapLoop("up");
    } else if ((e.key === "ArrowUp" || e.key === "PageUp") && top <= 2) {
      e.preventDefault(); wrapLoop("down");
    } else if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault(); activeIdx < slideEls.length - 1 && gotoSlide(activeIdx + 1);
    } else if (e.key === "ArrowUp" || e.key === "PageUp") {
      e.preventDefault(); activeIdx > 0 && gotoSlide(activeIdx - 1);
    }
  });

  // --- Copy link on caption click ---
  $caption.addEventListener("click", async () => {
    if (activeIdx === 0) { showToast("Welcome to Chandni Silk Mills"); return; }
    try {
      const design = designs[activeIdx];
      if (design) {
        await navigator.clipboard.writeText(design.url);
        showToast("Link copied!");
      }
    } catch (_) { showToast("Link copied!"); }
  });

  // --- INIT ---
  try {
    await Promise.all([fetchDesigns(), fetchPrices()]);
    // Render initial batch
    renderBatch(0, INITIAL_BATCH);
    setupSentinel();
    $counter.textContent = totalDesigns + " items";
    // Fade out loading screen
    $loading.classList.add("done");
    setTimeout(() => $loading.remove(), 500);
    // Fire initial update
    onSlideChange();
  } catch (err) {
    console.error("Price catalog init failed:", err);
    $loading.classList.add("done");
    setTimeout(() => $loading.remove(), 500);
    $counter.textContent = "Error loading catalog";
  }
})();
</script>
</body>
</html>
