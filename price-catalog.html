<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0e" />
<meta name="description" content="Chandni Silk Mills — price catalog: browse designs one at a time, each with its price." />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Chandni Silk Mills — Price Catalog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230d1117'/><text x='50' y='68' font-size='46' text-anchor='middle' fill='%2334d399' font-family='Arial' font-weight='bold'>CS</text></svg>">
<style>
  :root {
    --bg: #0b0b0e;
    --accent: #34d399;
    --accent-2: #f5c451;
    --text: #eef2f7;
    --muted: #9aa7b8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-y: none;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ---------- Full-screen slides ---------- */
  .slide {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: grid;
    place-items: center;
    background:
      radial-gradient(140% 90% at 85% -10%, rgba(52, 211, 153, 0.07), transparent 55%),
      radial-gradient(120% 80% at 0% 110%, rgba(245, 196, 81, 0.05), transparent 50%),
      var(--bg);
  }
  .media {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    overflow: hidden;
    touch-action: manipulation; /* let our double-tap toggle win over the browser's zoom */
  }
  .media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .media img.ph {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(18px) saturate(1.25);
    transform: scale(1.1);
    opacity: 1;
    transition: opacity 0.5s ease;
    pointer-events: none;
    z-index: 1;
  }
  .media img.full { position: relative; z-index: 2; opacity: 0; transition: opacity 0.5s ease; }
  .media.ready img.ph { opacity: 0; }
  .media.ready img.full { opacity: 1; }
  .media.zoom img { object-fit: cover; cursor: zoom-out; }
  .media:not(.zoom) img { cursor: zoom-in; }
  .slide::after { /* soft vignette for depth */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.42));
    pointer-events: none;
  }
  .caption:empty { display: none; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0;
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .pill {
    background: rgba(10, 10, 14, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .pill .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    margin-right: 7px;
    vertical-align: 1px;
  }
  .pill.muted { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  a.pill { text-decoration: none; color: var(--muted); transition: color 0.15s, border-color 0.15s; }
  a.pill:hover { color: var(--accent); border-color: rgba(52, 211, 153, 0.4); }

  /* ---------- Right rail: arrows + progress ---------- */
  .rail {
    position: fixed;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: calc(env(safe-area-inset-top, 0px) + 6px) 0 calc(env(safe-area-inset-bottom, 0px) + 6px);
  }
  .rail button {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(10, 10, 14, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    color: #fff;
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    opacity: 0.85;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    transition: opacity 0.15s, transform 0.15s, background 0.15s;
    touch-action: manipulation;
  }
  .rail button:hover { opacity: 1; transform: scale(1.08); background: rgba(52, 211, 153, 0.85); color: #08120d; }
  .rail button:active { transform: scale(0.94); }
  .track {
    width: 3px;
    height: 30vh;
    background: rgba(255,255,255,0.16);
    border-radius: 99px;
    position: relative;
    overflow: hidden;
  }
  .thumb {
    position: absolute;
    left: 0;
    width: 100%;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
    border-radius: 99px;
    box-shadow: 0 0 10px rgba(52, 211, 153, 0.55);
    transition: top 0.2s ease, height 0.2s ease;
  }

  /* ---------- Scroll hint (first slide) ---------- */
  .hint {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translateX(-50%);
    z-index: 60;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.85);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events: none;
  }
  .hint.faded { opacity: 0; transform: translateX(-50%) translateY(14px); }
  .hint .chevron {
    width: 26px; height: 26px;
    border-right: 3px solid var(--accent);
    border-bottom: 3px solid var(--accent);
    transform: rotate(45deg);
    animation: bounce 1.6s ease-in-out infinite;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
  }
  @keyframes bounce {
    0%, 100% { transform: rotate(45deg) translate(0, 0); opacity: 1; }
    50%      { transform: rotate(45deg) translate(6px, 6px); opacity: 0.55; }
  }

  /* ---------- Caption ---------- */
  .caption {
    position: fixed;
    left: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    z-index: 60;
    max-width: 72%;
    background: rgba(10, 10, 14, 0.66);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--muted);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    word-break: break-all;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    touch-action: manipulation;
  }
  .caption:hover { border-color: rgba(52, 211, 153, 0.4); color: var(--text); }
  .caption b { color: var(--text); font-weight: 600; }

  /* ---------- Price pill: ₹ price per design ---------- */
  .price-pill {
    position: absolute;
    right: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 52px);
    z-index: 5;
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    background: rgba(10, 10, 14, 0.8);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(245, 196, 81, 0.55);
    color: var(--accent-2);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
    padding: 8px 16px;
    border-radius: 999px;
    pointer-events: none;
    box-shadow: 0 6px 22px rgba(0,0,0,0.45);
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }
  .price-pill .rs { font-size: 13px; font-weight: 700; opacity: 0.85; }
  .price-pill.empty {
    border-color: rgba(255,255,255,0.2);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    text-shadow: none;
  }
  .wa-cta {
    position: fixed;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    z-index: 80;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 13px 18px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
    touch-action: manipulation;
  }
  .wa-cta:hover { filter: brightness(1.08); }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 64px);
    transform: translateX(-50%) translateY(70px);
    background: #10161f;
    border: 1px solid rgba(52, 211, 153, 0.6);
    color: var(--accent);
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 88vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---------- Responsive: tablet ---------- */
  @media (max-width: 768px) {
    .rail { right: 6px; gap: 10px; }
    .rail button { width: 36px; height: 36px; font-size: 16px; }
    .track { height: 24vh; }
    .topbar { padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 0; }
    .topbar .pill { padding: 6px 10px; font-size: 11px; }
    .price-pill { font-size: 18px; padding: 6px 14px; right: 10px; }
    .price-pill .rs { font-size: 11px; }
    .caption { max-width: 68%; font-size: 10.5px; padding: 6px 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
    .wa-cta { padding: 10px 14px; font-size: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }
  }

  /* ---------- Responsive: small phone ---------- */
  @media (max-width: 420px) {
    .rail { right: 4px; gap: 8px; }
    .rail button { width: 32px; height: 32px; font-size: 14px; }
    .track { height: 20vh; }
    .price-pill { font-size: 16px; padding: 5px 12px; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 44px); }
    .price-pill .rs { font-size: 10px; }
    .price-pill.empty { font-size: 11px; padding: 4px 10px; }
    .topbar .pill { padding: 5px 8px; font-size: 10px; }
    .caption { max-width: 62%; font-size: 9.5px; padding: 5px 8px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); left: 8px; }
    .wa-cta { padding: 8px 12px; font-size: 11px; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); right: 8px; }
    .hint { font-size: 9px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  }

  /* ---------- Responsive: landscape phone ---------- */
  @media (max-height: 480px) and (orientation: landscape) {
    .topbar .pill { padding: 4px 8px; font-size: 10px; }
    .price-pill { top: calc(env(safe-area-inset-top, 0px) + 44px); font-size: 16px; padding: 4px 12px; }
    .price-pill .rs { font-size: 10px; }
    .rail button { width: 30px; height: 30px; font-size: 13px; }
    .track { height: 22vh; }
    .caption { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); font-size: 9px; }
    .wa-cta { bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); padding: 6px 10px; font-size: 10px; }
  }
</style>
</head>
<body>

<div id="feed"></div>

<header class="topbar">
  <div class="pill"><span class="dot"></span>Chandni Silk Mills</div>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="pill" href="index.html">← Full catalog</a>
    <div class="pill muted" id="counter">— / —</div>
  </div>
</header>

<nav class="rail" aria-label="Scroll controls">
  <button id="btn-up" aria-label="Previous item">↑</button>
  <div class="track"><div class="thumb" id="thumb"></div></div>
  <button id="btn-down" aria-label="Next item">↓</button>
</nav>

<div class="hint" id="hint">
  <span class="chevron"></span>
  Scroll to explore
</div>

<div class="caption" id="caption" title="Tap to copy link"></div>
<div id="toast"></div>
<a class="wa-cta" id="wa-cta" href="#"
   target="_blank" rel="noopener">💬&nbsp; Book a video call</a>

<noscript><p style="color:#fff;padding:40px;text-align:center">This catalog feed needs JavaScript enabled.</p></noscript>

    "IMG_9662.JPG": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA4KCw0LCQ4NDA0QDw4RFiQXFhQUFiwgIRokNC43NjMuMjI6QVNGOj1OPjIySGJJTlZYXV5dOEVmbWVabFNbXVn/2wBDAQ8QEBYTFioXFypZOzI7WVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVn/wAARCAAgABgDASIAAhEBAxEB/8QAGQAAAwEBAQAAAAAAAAAAAAAAAAQFBgID/8QAJhAAAgEEAAUEAwAAAAAAAAAAAQIDAAQRIQUSEzEyFCNRobHB0f/EABYBAQEBAAAAAAAAAAAAAAAAAAMEAf/EABoRAAIDAQEAAAAAAAAAAAAAAAECAAMREyH/2gAMAwEAAhEDEQA/AJc/qonUsgKAZypJCj4+a49bnYRyPLZ/P9FeLPNpZwyJrmLIdCri8P4VMA6IpQjRVtYqa+1as8iopfSYjw+7n6yNBAx5WJ6gPjrsaKXmlitLuaC3KciPoBvqikVtAIlArQgbNFcXVxdWUsTw+aEHL5xqsmsLMmehjI7EAZ+6rCG4sybYyzsF1zc3ekzFMjEAMBnXt7pXQqNgJZUxzCJOgWNYVV1GR3DL+6KeiE6AqWbIzsqM0VnNjB2f/9k="
  };

  const ORIGIN = location.protocol === "file:" ? "https://chandni-catalog.pages.dev" : location.origin;
  const IS_FILE = location.protocol === "file:";
  // Images now live in R2, keyed by design_id — NOT by name. window.CATALOG_FILES
  // only has names, so fetch the id->url mapping directly, same fix as admin.html.
  // (Legacy pre-R2 designs happen to have name === design_id, which is why this
  // "worked" before for old designs but silently 404'd for every new upload.)
  const stem = (f) => f.replace(/\.[^.]+$/, "");
  const imgByItem = {}; // stem(name) -> real R2-backed url
  async function loadImageUrls() {
    let page = 1, total = Infinity, all = [];
    do {
      const r = await fetch(`${ORIGIN}/api/designs?format=pages&limit=100&page=${page}`);
      const d = await r.json();
      all = all.concat(d.designs || []);
      total = Number(d.total || all.length);
      page++;
    } while (all.length < total && page < 20);
    all.forEach((d) => { if (d.name) imgByItem[stem(d.name)] = d.url; });
  }
  await loadImageUrls();
  // Engagement API always hits the deployed backend (works from file:// and local dev).
  const API = ORIGIN + "/prices";
  const WA_NUMBER = "919537097267";
  // mid/webp derived sizes aren't generated yet — everything falls back to original.
  const urlFor = (f) => imgByItem[stem(f)] || "";
  const webpUrl = (f) => imgByItem[stem(f)] || "";
  const midUrl = (f) => imgByItem[stem(f)] || "";
  // The closing poster isn't a design row — it's a fixed R2 object, same convention as index.html.
  const LANDING = "landing.webp";
  const landingUrl = ORIGIN + "/api/designs?img=" + encodeURIComponent("designs/original/" + LANDING);
  const LANDING_LQIP = landingUrl; // no separate blurred placeholder generated for this one yet

  const feed = document.getElementById("feed");
  let renderedCount = 0;
  const PAGE_SIZE = 36;
  let loadingMore = false;

  function renderInitialSlides() {
    const files = (window.CATALOG_FILES || []).slice(0, PAGE_SIZE);
    renderedCount = files.length;
    FILES.push(...files);
    total = FILES.length;
    files.forEach((f, i) => {
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.dataset.index = i;
      slide.dataset.item = stem(f);
      const media = document.createElement("div");
      media.className = "media has-img";
      media.innerHTML =
        '<img class="ph" src="' + (LQIP[f] || urlFor(f)) + '" alt="" aria-hidden="true" decoding="async">' +
        '<img class="full" src="' + midUrl(f) + '" alt="' + f + '" loading="lazy" decoding="async">';
      slide.appendChild(media);
      feed.appendChild(slide);
      const full = media.querySelector("img.full");
      const markReady = () => { media.classList.add("ready"); };
      if (full.complete && full.naturalWidth > 0) markReady();
      else full.addEventListener("load", markReady, { once: true });
    });
    setupInfiniteScroll();
  }

  function appendMoreSlides(files, startIndex) {
    const frag = document.createDocumentFragment();
    files.forEach((f, i) => {
      const idx = startIndex + i;
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.dataset.index = idx;
      slide.dataset.item = stem(f);
      const media = document.createElement("div");
      media.className = "media has-img";
      media.innerHTML =
        '<img class="ph" src="' + (LQIP[f] || urlFor(f)) + '" alt="" aria-hidden="true" decoding="async">' +
        '<img class="full" src="' + midUrl(f) + '" alt="' + f + '" loading="lazy" decoding="async">';
      slide.appendChild(media);
      frag.appendChild(slide);
      const full = media.querySelector("img.full");
      const markReady = () => { media.classList.add("ready"); };
      if (full.complete && full.naturalWidth > 0) markReady();
      else full.addEventListener("load", markReady, { once: true });
    });
    feed.appendChild(frag);
    total = FILES.length;
  }

  async function loadMoreSlides() {
    if (loadingMore || renderedCount >= (window.CATALOG_FILES || []).length) return;
    loadingMore = true;
    try {
      await new Promise((resolve) => setTimeout(resolve, 50));
      const nextBatch = (window.CATALOG_FILES || []).slice(renderedCount, renderedCount + PAGE_SIZE);
      const start = renderedCount;
      appendMoreSlides(nextBatch, start);
      FILES.push(...nextBatch);
      renderedCount += nextBatch.length;
      total = FILES.length;
    } catch (e) {
      console.error("load more slides failed:", e);
    } finally {
      loadingMore = false;
    }
  }

  function setupInfiniteScroll() {
    const sentinel = document.createElement("div");
    sentinel.id = "feed-sentinel";
    sentinel.style.height = "1px";
    feed.parentNode.insertBefore(sentinel, feed.nextSibling);
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting) loadMoreSlides();
    }, { rootMargin: "800px" });
    observer.observe(sentinel);
  }

  // ---------- Init after media.js loads ----------
  function initFeed() {
    if ((window.CATALOG_FILES || []).length === 0) {
      setTimeout(initFeed, 50);
      return;
    }
    renderInitialSlides();
    updateCounter();
    loadPrices();
    refreshCta();
  }

  setTimeout(initFeed, 0);

  // ---------- Slide interaction layer (works with dynamically added slides) ----------
  function buildIntroSlide() {
    const intro = document.createElement("section");
    intro.className = "slide intro";
    intro.dataset.index = "-1";
    intro.innerHTML =
      '<div class="media has-img">' +
        '<img class="ph" src="' + LANDING_LQIP + '" alt="" aria-hidden="true" decoding="async">' +
        '<img class="full" src="' + landingUrl + '" alt="Chandni Silk Mills — Catalog" decoding="async" fetchpriority="high" loading="eager">' +
      '</div>';
    feed.insertBefore(intro, feed.firstChild);
    const introMedia = intro.querySelector(".media");
    const introFull = introMedia.querySelector("img.full");
    const introReady = () => { introMedia.classList.add("ready"); introFull.dataset.upgraded = "1"; };
    if (introFull.complete && introFull.naturalWidth > 0) introReady();
    else introFull.addEventListener("load", introReady, { once: true });
    return intro;
  }
  buildIntroSlide();

  const counter = document.getElementById("counter");
  const thumb = document.getElementById("thumb");
  const hint = document.getElementById("hint");
  const caption = document.getElementById("caption");
  const toast = document.getElementById("toast");
  const maxScroll = () => document.documentElement.scrollHeight - window.innerHeight;
  const gotoSlide = (i) => {
    const allSlides = Array.from(document.querySelectorAll(".slide"));
    const target = allSlides[i];
    if (target) window.scrollTo({ top: target.offsetTop, behavior: "smooth" });
  };

  let active = 0;
  const preloaded = new Map();
  const preloadNear = (idx) => {
    const allSlides = Array.from(document.querySelectorAll(".slide"));
    for (const j of [idx - 1, idx, idx + 1]) {
      if (j < 1 || j >= allSlides.length) continue;
      const slide = allSlides[j];
      const f = slide.dataset.item;
      if (!f || preloaded.has(f)) continue;
      const im = new Image();
      im.src = midUrl(f + ".webp");
      preloaded.set(f, im);
    }
  };

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2000);
  }

  function upgradeToFull(slide) {
    const img = slide.querySelector("img.full");
    if (!img || img.dataset.upgraded) return;
    if (+slide.dataset.index === -1) return;
    const fname = slide.dataset.item;
    const fullUrl = webpUrl(fname + ".webp");
    if (img.getAttribute("src") === fullUrl) { img.dataset.upgraded = "1"; return; }
    const up = new Image();
    up.onload = () => { if (img.getAttribute("src") !== fullUrl) img.src = fullUrl; img.dataset.upgraded = "1"; };
    up.onerror = () => { img.dataset.upgraded = "1"; };
    up.src = fullUrl;
  }

  function refreshCta() {
    const waCta = document.getElementById("wa-cta");
    if (!waCta) return;
    let item = "";
    const allSlides = Array.from(document.querySelectorAll(".slide"));
    if (active > 0 && active < allSlides.length) item = allSlides[active].dataset.item || "";
    const p = item ? prices[stem(item + ".webp")] : undefined;
    const priceTxt = p != null ? " (₹" + Number(p).toLocaleString("en-IN") + ")" : "";
    const shareLink = item ? (ORIGIN + "/share?item=" + encodeURIComponent(item)) : "";
    const msg = encodeURIComponent(
      "Hi Chandni Silk Mills! 👋 I saw design " + (item || "in your catalog") + priceTxt +
      " and I'd like to book a video call to discuss it." + (shareLink ? "\n\n" + shareLink : "")
    );
    waCta.href = "https://wa.me/" + WA_NUMBER + "?text=" + msg;
  }

  function update() {
    const allSlides = Array.from(document.querySelectorAll(".slide"));
    const slideCount = allSlides.length;
    counter.textContent = active === 0 ? total + " items" : active + " / " + (total > 0 ? total - 1 : 0);
    const pct = slideCount > 1 ? (active / (slideCount - 1)) * 100 : 0;
    const h = 100 / slideCount;
    thumb.style.top = (pct * (100 - h) / 100) + "%";
    thumb.style.height = h + "%";
    hint.classList.add("faded");
    caption.innerHTML = active === 0 ? "" : "Tap to copy link";
    preloadNear(active);
    upgradeToFull(allSlides[active]);
    refreshCta();
  }

  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) {
        const allSlides = Array.from(document.querySelectorAll(".slide"));
        const idx = allSlides.indexOf(e.target);
        if (idx !== active && idx >= 0) { active = idx; update(); }
      }
    }
  }, { threshold: 0.5 });
  document.querySelectorAll(".slide").forEach((s) => io.observe(s));

  // Rebind observer after slides are added
  const origAppendMore = appendMoreSlides;
  appendMoreSlides = function(files, startIndex) {
    origAppendMore(files, startIndex);
    setTimeout(() => {
      document.querySelectorAll(".slide").forEach((s) => io.observe(s));
      update();
      // Add price pills to newly loaded slides
      document.querySelectorAll(".slide").forEach((s) => {
        if (s.querySelector(".price-pill")) return;
        const item = s.dataset.item;
        if (!item) return;
        const p = prices[stem(item)];
        const pill = document.createElement("span");
        pill.className = "price-pill" + (p == null ? " empty" : "");
        pill.innerHTML = p != null
          ? '<span class="rs">₹</span> ' + Number(p).toLocaleString("en-IN")
          : "Price on request";
        s.appendChild(pill);
      });
    }, 0);
  };

  // ---------- Endless loop ----------
  let lastWrap = 0;
  function wrap(dir) {
    const now = Date.now();
    if (now - lastWrap < 800) return;
    lastWrap = now;
    window.scrollTo({ top: dir === "up" ? 0 : maxScroll(), behavior: "smooth" });
  }

  let touchStartY = null;
  let touchStartTop = 0;
  document.addEventListener("touchstart", (e) => {
    touchStartY = e.touches[0].clientY;
    touchStartTop = window.scrollY;
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (touchStartY === null) return;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (dy > 50 && touchStartTop <= 60) wrap("down");
    else if (dy < -50 && touchStartTop >= maxScroll() - 60) wrap("up");
    touchStartY = null;
  }, { passive: true });

  window.addEventListener("wheel", (e) => {
    const top = window.scrollY;
    if (e.deltaY < -30 && top <= 2) { e.preventDefault(); wrap("down"); }
    else if (e.deltaY > 30 && top >= maxScroll() - 2) { e.preventDefault(); wrap("up"); }
  }, { passive: false });

  window.addEventListener("keydown", (e) => {
    if (e.target && e.target.closest && e.target.closest("button, a, input, textarea")) return;
    const top = window.scrollY;
    if ((e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") && top >= maxScroll() - 2) {
      e.preventDefault(); wrap("up");
    } else if ((e.key === "ArrowUp" || e.key === "PageUp") && top <= 2) {
      e.preventDefault(); wrap("down");
    }
  });

  document.getElementById("btn-up").addEventListener("click", () => {
    active > 0 ? gotoSlide(active - 1) : wrap("down");
  });
  document.getElementById("btn-down").addEventListener("click", () => {
    const allSlides = Array.from(document.querySelectorAll(".slide"));
    active < allSlides.length - 1 ? gotoSlide(active + 1) : wrap("up");
  });

  caption.addEventListener("click", async () => {
    if (active === 0) { showToast("Welcome to Chandni Silk Mills"); return; }
    try {
      const allSlides = Array.from(document.querySelectorAll(".slide"));
      const item = allSlides[active]?.dataset.item || "";
      await navigator.clipboard.writeText(urlFor(item));
      showToast("Link copied");
    } catch (e) {
      showToast("Link copied");
    }
  });

  update();

  // ============================================================
  // Prices: ₹ price per design, loaded from the price API
  // ============================================================
  const prices = {};
  async function loadPrices() {
    try {
      const r = await fetch(API);
      const d = await r.json();
      Object.assign(prices, d.prices || {});
      document.querySelectorAll(".slide").forEach((s) => {
        const item = s.dataset.item;
        if (!item || s.querySelector(".price-pill")) return;
        const p = prices[stem(item)];
        const pill = document.createElement("span");
        pill.className = "price-pill" + (p == null ? " empty" : "");
        pill.innerHTML = p != null
          ? '<span class="rs">₹</span> ' + Number(p).toLocaleString("en-IN")
          : "Price on request";
        s.appendChild(pill);
      });
    } catch (e) { /* keep slides clean if the API is unavailable */ }
  }
  refreshCta();
})();
</script>
