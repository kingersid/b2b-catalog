# Deploy to Cloudflare Pages on every push to main.
# Setup:
#   1. Create a Cloudflare API token with "Cloudflare Pages: Edit" permission.
#   2. Add it as a GitHub repo secret named CLOUDFLARE_API_TOKEN.
#   3. Find your Account ID in the Cloudflare dashboard → right sidebar.
#   4. Add it as a GitHub repo secret named CLOUDFLARE_ACCOUNT_ID.
#
# After setup, every push to main auto-deploys to production.
# Pull requests get a preview URL automatically.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch (saves CI minutes).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=chandni-catalog --branch=${{ github.head_ref || github.ref_name }}
