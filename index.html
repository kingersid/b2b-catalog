<style>
  :root {
    --bg: #0b0b0e;
    --accent: #34d399;
    --accent-2: #f5c451;
    --text: #eef2f7;
    --muted: #9aa7b8;
    --card: #12161d;
    --border: rgba(255,255,255,0.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(140% 90% at 85% -10%, rgba(52, 211, 153, 0.07), transparent 55%),
      radial-gradient(120% 80% at 0% 110%, rgba(245, 196, 81, 0.05), transparent 50%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow-x: hidden;
  }

  /* ============================================================
     VIEW: GRID — the catalog at a glance (default landing)
     ============================================================ */
  #view-grid { min-height: 100dvh; position: relative; }

  /* Grid morph: after 2s, design #1's cell expands into a hero.
     The rest of the grid fades below, a CTA rises over the hero. */
  #view-grid.morphed .cell:first-child {
    grid-column: 1 / -1;
    aspect-ratio: auto;
    height: 100dvh;
    border-radius: 0;
    transition: all 0.85s cubic-bezier(0.22, 1, 0.36, 1);
  }
  #view-grid.morphed .cell:first-child img { object-fit: contain; }
  #view-grid.morphed .cell:not(:first-child) {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease 0.2s;
  }
  #view-grid.morphed .topbar,
  #view-grid.morphed .grid-sub {
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .morph-cta {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 8vh);
    transform: translateX(-50%) translateY(24px);
    z-index: 25;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.55s ease 0.3s, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.3s;
  }
  .morph-cta.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .morph-cta .cta-btn {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 26px;
    border: 1px solid rgba(52,211,153,0.45);
    border-radius: 20px;
    background: rgba(10, 10, 14, 0.72);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55), 0 0 32px rgba(52, 211, 153, 0.12);
    touch-action: manipulation;
  }
  .morph-cta .cta-btn:active { transform: scale(0.97); }
  .morph-cta .cta-arrow {
    width: 26px; height: 26px;
    border-right: 3px solid var(--accent);
    border-bottom: 3px solid var(--accent);
    transform: rotate(225deg);
    animation: cta-float 1.6s ease-in-out infinite;
  }
  .morph-cta .cta-line {
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: -0.2px;
    color: #fff;
    line-height: 1.35;
  }
  .morph-cta .cta-line small {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 2px;
  }
  @keyframes cta-float {
    0%, 100% { transform: rotate(225deg) translateX(0); opacity: 0.75; }
    50%      { transform: rotate(225deg) translateX(-5px); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    #view-grid.morphed .cell:first-child { transition: none; }
    #view-grid.morphed .cell:not(:first-child) { transition: none; }
    #view-grid.morphed .topbar,
    #view-grid.morphed .grid-sub { transition: none; }
    .morph-cta { transition: opacity 0.3s; transform: translateX(-50%); }
    .morph-cta .cta-arrow { animation: none; }
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 14px 12px;
    background: linear-gradient(180deg, rgba(11,11,14,0.94), rgba(11,11,14,0.82) 70%, rgba(11,11,14,0));
  }
  .pill {
    background: rgba(10, 10, 14, 0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    white-space: nowrap;
  }
  .pill .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    margin-right: 7px;
    vertical-align: 1px;
  }
  .pill.muted { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  #visits { display: inline-flex; align-items: center; gap: 5px; color: var(--accent-2); }

  .grid-sub {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    padding: 2px 16px 14px;
    letter-spacing: 0.2px;
  }
  .grid-sub b { color: var(--text); }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    padding: 0 3px calc(env(safe-area-inset-bottom, 0px) + 24px);
  }
  .cell {
    position: relative;
    aspect-ratio: 3 / 4.2;
    border-radius: 8px;
    overflow: hidden;
    background: var(--card);
    cursor: pointer;
    border: none;
    padding: 0;
    touch-action: manipulation;
  }
  .cell img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.25s ease;
  }
  .cell.loaded img { opacity: 1; }
  .cell:active img { transform: scale(1.06); }
  .cell .loading {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-size: 11px; color: var(--muted);
  }
  .cell .num {
    position: absolute;
    left: 6px; bottom: 6px;
    z-index: 2;
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    background: rgba(10,10,14,0.6);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 6px;
    padding: 2px 6px;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .cell .heart-badge {
    position: absolute;
    right: 6px; bottom: 6px;
    z-index: 2;
    font-size: 11px;
    color: #ff5b6e;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    pointer-events: none;
    display: none;
  }
  .cell.show-heart .heart-badge { display: block; }
  /* Trending: top-3 most-hearted designs get a fire badge */
  .cell .trend {
    position: absolute;
    left: 6px; top: 6px;
    z-index: 2;
    font-size: 12px;
    background: rgba(10,10,14,0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    border-radius: 6px;
    padding: 2px 6px;
    pointer-events: none;
    display: none;
  }
  .cell.trending .trend { display: block; }

  /* ============================================================
     VIEW: DETAIL — full-screen slides from the tapped design
     ============================================================ */
  #view-detail {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: var(--bg);
    display: none;
    flex-direction: column;
  }
  #view-detail.open { display: flex; animation: detail-in 0.28s ease; }
  @keyframes detail-in {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .detail-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 0;
    pointer-events: none;
  }
  .detail-bar > * { pointer-events: auto; }
  .back-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(10,10,14,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    touch-action: manipulation;
    transition: transform 0.15s, background 0.15s;
  }
  .back-btn:hover { transform: scale(1.06); background: rgba(52,211,153,0.85); color: #08120d; }
  .back-btn:active { transform: scale(0.94); }
  .detail-pills { display: flex; align-items: center; gap: 8px; }
  .copy-btn {
    border: 1px solid var(--border);
    background: rgba(10,10,14,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    touch-action: manipulation;
    transition: color 0.15s, border-color 0.15s;
  }
  .copy-btn:hover { color: var(--accent); border-color: rgba(52,211,153,0.4); }

  .slide-area {
    flex: 1;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    scroll-behavior: smooth;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
  }
  .slide {
    position: relative;
    width: 100%;
    height: 100dvh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    display: grid;
    place-items: center;
    background:
      radial-gradient(140% 90% at 85% -10%, rgba(52,211,153,0.07), transparent 55%),
      radial-gradient(120% 80% at 0% 110%, rgba(245,196,81,0.05), transparent 50%),
      var(--bg);
  }
  .media {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    overflow: hidden;
    touch-action: manipulation;
  }
  .media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .slide::after { /* soft vignette for depth */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,0.42));
    pointer-events: none;
  }
  .heart {
    position: absolute;
    left: 12px;
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    z-index: 6;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(10, 10, 14, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 8px 12px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.15s, background 0.15s;
  }
  .heart:hover { transform: scale(1.06); background: rgba(52, 211, 153, 0.2); }
  .heart:active { transform: scale(0.92); }
  .heart .n { font-size: 12px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .heart.liked { color: #ff5b6e; border-color: rgba(255, 91, 110, 0.5); }
  .heart.liked .n { color: #ff5b6e; }

  /* Closing poster card (after the last design) */
  .slide.closing .media img { object-fit: cover; }
  .closing-card {
    position: absolute;
    z-index: 6;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 13vh + 20px);
    width: min(84vw, 420px);
    text-align: center;
    background: rgba(10, 10, 14, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 18px 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .closing-card .brand-line {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--accent-2);
    margin-bottom: 6px;
  }
  .closing-card h2 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
  .closing-card p { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .closing-card .back-to-grid {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--accent), #10b981);
    color: #08120d;
    font: inherit;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .closing-card .back-to-grid:active { transform: scale(0.97); }

  /* Next-slide peek strip */
  .peek {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 11vh;
    min-height: 88px;
    z-index: 55;
    overflow: hidden;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .peek-bg {
    position: absolute;
    inset: -6px 0 0 0;
    background-size: cover;
    background-position: center top;
    filter: blur(14px) saturate(1.05);
    transform: scale(1.12);
    transform-origin: center top;
  }
  .peek::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(11,11,14,0.92), rgba(11,11,14,0.22) 45%, rgba(11,11,14,0.12));
  }
  .peek .chev {
    position: absolute;
    top: 12px;
    left: 50%;
    margin-left: -11px;
    width: 22px; height: 22px;
    border-right: 3px solid #fff;
    border-bottom: 3px solid #fff;
    transform: rotate(225deg);
    animation: peek-bounce 1.5s ease-in-out infinite;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
    z-index: 2;
  }
  .peek .lbl {
    position: absolute;
    top: 38px;
    left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    z-index: 2;
  }
  @keyframes peek-bounce {
    0%, 100% { transform: rotate(225deg) translateY(2px); opacity: 0.75; }
    50%      { transform: rotate(225deg) translateY(-4px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .peek .chev { animation: none; }
  }

  /* Zoomable detail media — transform-driven, no layout thrash */
  .media img.full {
    will-change: transform;
    transition: transform 0.18s ease-out;
  }
  .media img.full.zooming { transition: none; } /* no easing while fingers move */
  .zoom-hint {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 11vh + 14px);
    transform: translateX(-50%);
    z-index: 6;
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
    background: rgba(10,10,14,0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 5px 12px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }
  .zoom-hint.show { opacity: 1; }

  /* WhatsApp video-call CTA — above the peek strip */
  .wa-cta {
    position: fixed;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 11vh + 16px);
    z-index: 80;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 13px 18px;
    border-radius: 999px;
    text-decoration: none;
    box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
    touch-action: manipulation;
  }
  .wa-cta:hover { filter: brightness(1.08); }

  /* Shortlist floating pill (grid view) */
  .shortlist-pill {
    position: fixed;
    left: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    z-index: 40;
    display: none;
    align-items: center;
    gap: 8px;
    border: 1px solid rgba(255, 91, 110, 0.5);
    background: rgba(10, 10, 14, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: #ff5b6e;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 11px 16px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    touch-action: manipulation;
    transition: transform 0.15s;
  }
  .shortlist-pill.show { display: inline-flex; }
  .shortlist-pill:active { transform: scale(0.94); }
  .shortlist-pill .n {
    background: #ff5b6e;
    color: #fff;
    border-radius: 999px;
    min-width: 20px;
    height: 20px;
    display: inline-grid;
    place-items: center;
    font-size: 11px;
    padding: 0 5px;
    font-variant-numeric: tabular-nums;
  }

  /* Shortlist bottom sheet */
  .sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .shortlist-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 95;
    transform: translateY(105%);
    transition: transform 0.28s cubic-bezier(0.32, 0.72, 0.25, 1);
    background: #10161f;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.6);
  }
  .shortlist-sheet.open { transform: translateY(0); }
  .shortlist-sheet h3 {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  .shortlist-sheet .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .shortlist-sheet .close-sheet {
    position: absolute;
    top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.06);
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
  }
  .sl-thumbs {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 14px 2px 6px;
    scrollbar-width: thin;
    min-height: 96px;
  }
  .sl-thumb {
    position: relative;
    flex: 0 0 auto;
    width: 74px;
    aspect-ratio: 3 / 4.2;
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    cursor: pointer;
    padding: 0;
    touch-action: manipulation;
  }
  .sl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sl-thumb .t-num {
    position: absolute;
    left: 4px; bottom: 4px;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    background: rgba(10,10,14,0.65);
    border-radius: 5px;
    padding: 1px 5px;
    font-variant-numeric: tabular-nums;
  }
  .sl-thumb .t-remove {
    position: absolute;
    top: 4px; right: 4px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(10,10,14,0.75);
    color: #fff;
    font-size: 11px;
    line-height: 17px;
    text-align: center;
  }
  .sl-empty {
    font-size: 12.5px;
    color: var(--muted);
    padding: 24px 4px;

  }
  .sl-actions {
    display: flex;
    gap: 10px;

  }
  .sl-actions .wa-send {
    flex: 1;

    align-items: center;

  /* Toast */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 11vh + 72px);
    transform: translateX(-50%) translateY(70px);
    background: #10161f;
    border: 1px solid rgba(52, 211, 153, 0.6);
    color: var(--accent);
    padding: 11px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.25s;
    pointer-events: none;
    z-index: 100;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    max-width: 88vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ============================================================
     Tablet & desktop: frame the detail slides as a centered column.
     ============================================================ */
  @media (min-width: 768px) {
    :root { --col: min(92vw, 500px); }
    .grid { grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 6px calc(env(safe-area-inset-bottom,0px) + 24px); }
    .media {
      width: var(--col);
      height: min(90dvh, 860px);
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 30px 90px rgba(0,0,0,0.65), 0 0 0 1px rgba(0,0,0,0.5);
    }
    .slide::after { background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55)); }
    .topbar { padding-left: calc(50% - var(--col) / 2); padding-right: calc(50% - var(--col) / 2); }
    .peek { left: 50%; right: auto; width: var(--col); border-radius: 0 0 20px 20px; }
    .wa-cta { right: calc(50% - var(--col) / 2 + 14px); }
    .heart { left: calc(50% - var(--col) / 2 + 12px); }
    .detail-bar { padding-left: calc(50% - var(--col) / 2 + 12px); padding-right: calc(50% - var(--col) / 2 + 12px); }
  }

<script>
  // Fetch designs from D1 API (with fallback for local dev)
  let FILES = [];

    // Fallback for local dev / file://
    FILES = [

      "72C3A2C5-ED34-4518-BCAF-64D9A58128C4.jpg","742cd8c1-cbda-48c3-a733-3cb6995107ea.jpg",
      "756A7C1D-241D-44C6-A1D4-CCAED10308F3.jpg","778bdcdf-4164-4bb2-8473-ae023ffba059.jpg",
      "IMG_8327.JPG","820be7d8-cddc-4e02-b69b-93930c097fcd.jpg",
      "84d1c227-bfe4-4957-8bc5-4c0c4545b705.jpg","90834BBB-ADD5-4694-B4BB-73B3C4FEA1F4.jpg",

      "d0af4d78-3622-414e-8ab6-fe9d34313870.jpg","d905329f-89f2-4c1c-b9d6-e7efe61b35c1.jpg",
      "E9967125-2C41-43D8-92A2-F602426A7EFE.jpg","f2c44321-1dd9-4840-a795-31053617549c.jpg",
      "f5205103-876c-4abf-b2cb-1ccfd61bf2ac.jpg","f8a3ba95-582f-4ada-b792-b7c18aea2f64.jpg",
      "FD482538-794F-47E4-B4F8-CE9FF619427E.jpg","FEA97D8E-626A-4449-9D1B-AEB50BA7D1D3.jpg",
      "IMG_0295.JPG","IMG_0467.JPG","IMG_0515.JPG",
      "819d3441-207b-4355-8c0a-c6d3dc743341.jpg","IMG_8453.JPG",
      "IMG_8928.JPG","IMG_8930.JPG","IMG_9078.JPG",
      "IMG_9199.JPG","IMG_9662.JPG",
      "98edd9f5-d59b-4b28-aba8-e6eb16a4befe.jpg"
    ];
    return false;
  }

  const ORIGIN = location.origin;
  const IS_FILE = location.protocol === "file:";
  // Static assets: relative paths for file://, origin-relative everywhere else (dev + prod).
  const urlFor = (f) => (IS_FILE ? "" : ORIGIN + "/") + encodeURIComponent(f);
  // Engagement API always hits the deployed backend (works from file:// and local dev).
  const API = (IS_FILE ? "https://chandni-catalog.pages.dev" : ORIGIN) + "/api/catalog";
  const DESIGNS_API = (IS_FILE ? "https://chandni-catalog.pages.dev" : ORIGIN) + "/api/designs";
  const WA_NUMBER = "919537097267";
  const webpUrl = (f) => (IS_FILE ? "webp/" : ORIGIN + "/webp/") + encodeURIComponent(f.replace(/\.[^.]+$/, "") + ".webp");
  const midUrl = (f) => (IS_FILE ? "mid/" : ORIGIN + "/mid/") + encodeURIComponent(f.replace(/\.[^.]+$/, "") + ".webp");
  const stem = (f) => f.replace(/\.[^.]+$/, "").toLowerCase();

  // Closing poster card (shown after the last design). Not in FILES.
  const LANDING = "landing.webp";
  let TOTAL = FILES.length;
  let POSTER_INDEX = TOTAL;

  function boot() {
    loadDesigns().then(() => {
      TOTAL = FILES.length;
      POSTER_INDEX = TOTAL;
      buildSlides();
      initGrid();
      initDetail();
      renderShortlist();
      update();
      trackVisit();
    });
  }

  // ============================================================
  // GRID
  // ============================================================
  function initGrid() {
    document.getElementById("grid-count").textContent = TOTAL;
    document.getElementById("cta-count").textContent = TOTAL;
    const grid = document.getElementById("grid");
    FILES.forEach((f, i) => {
      const cell = document.createElement("button");
      cell.className = "cell";
      cell.dataset.item = stem(f);
      cell.setAttribute("aria-label", "Open design " + (i + 1));
      cell.innerHTML =
        '<span class="loading">…</span>' +
        '<img alt="Design ' + (i + 1) + '" src="' + midUrl(f) + '"' +
        (i < 6 ? ' loading="eager" fetchpriority="high"' : ' loading="lazy"') +
        ' decoding="async">' +
        '<span class="num">#' + (i + 1) + "</span>" +
        '<span class="heart-badge"></span>' +
        '<span class="trend" title="Trending — one of the most liked designs">🔥</span>';
      cell.querySelector("img").addEventListener("load", () => cell.classList.add("loaded"), { once: true });
      cell.addEventListener("click", () => openDetail(i));
      grid.appendChild(cell);
    });
  }

  // ============================================================
  // DETAIL
  // ============================================================
  function initDetail() {
    const detail = document.getElementById("view-detail");
    const slideArea = document.getElementById("slide-area");
    const peek = document.getElementById("peek");
    const peekBg = document.getElementById("peek-bg");
    const waCta = document.getElementById("wa-cta");
    const toast = document.getElementById("toast");
    const counter = document.getElementById("counter");
    const copyBtn = document.getElementById("copy-btn");

    let gridScroll = 0;
    let active = 0;

    // ============================================================
    // GRID MORPH
    // ============================================================
  const morphCta = document.getElementById("morph-cta");
  const MORPH_KEY = "csm_grid_morphed";
  let morphTimer = null;

  function triggerMorph() {
    viewGrid.classList.add("morphed");
    clearTimeout(morphTimer);
    morphTimer = setTimeout(() => morphCta.classList.add("show"), 50);
  }

  function dismissMorph() {
    viewGrid.classList.remove("morphed");
    morphCta.classList.remove("show");
    clearTimeout(morphTimer);
  }

  // First-visit-per-session: trigger the morph 2s after page load.
  let morphedBefore = false;
  try { morphedBefore = !!sessionStorage.getItem(MORPH_KEY); } catch (e) { /* private mode */ }
  if (!morphedBefore) {
    try { sessionStorage.setItem(MORPH_KEY, "1"); } catch (e) { /* private mode */ }
    clearTimeout(morphTimer);
    morphTimer = setTimeout(triggerMorph, 2000);
  }

  // CTA tap: dismiss the morph, then open the swipe view starting at
  // design #2 (design #1 is already shown as the hero).
  document.getElementById("morph-cta-btn").addEventListener("click", () => {
    dismissMorph();
    fetch(API + "?action=ctaClick", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ itemId: "heroSwipeUp" }),
    }).catch(() => {});
    setTimeout(() => openDetail(1), 300);
  });

  // Scrolling down (swipe up) also dismisses the morph — the grid
  // fades back in and the user can browse the full catalog.
  let scrollDismissed = false;
  window.addEventListener("scroll", () => {
    if (!viewGrid.classList.contains("morphed") || scrollDismissed) return;
    if (window.scrollY > 80) {
      scrollDismissed = true;
      dismissMorph();
    }
  }, { passive: true });

  // ============================================================
  // DETAIL SLIDES (designs + closing poster card)
  // ============================================================
  function buildSlides() {
    slideArea.innerHTML = "";
    FILES.forEach((f, i) => {
      const slide = document.createElement("section");
      slide.className = "slide";
      slide.dataset.index = i;
      slide.innerHTML =
        '<div class="media">' +
          '<img class="full" src="' + midUrl(f) + '" alt="Design ' + (i + 1) + '"' +
          (i < 2 ? ' loading="eager"' : ' loading="lazy"') + ' decoding="async">' +
          '<span class="zoom-hint">Pinch or double-tap to zoom the fabric</span>' +
        "</div>" +
        '<button class="heart" data-item="' + stem(f) + '" aria-label="Like this design">♡ <span class="n">0</span></button>';
      slideArea.appendChild(slide);
    });
    // Closing poster card: brand moment + back-to-catalog button.
    const poster = document.createElement("section");
    poster.className = "slide closing";
    poster.dataset.index = POSTER_INDEX;
    poster.innerHTML =
      '<div class="media">' +
        '<img class="full" src="' + urlFor(LANDING) + '" alt="Chandni Silk Mills — Catalog" loading="lazy" decoding="async">' +
      "</div>" +
      '<div class="closing-card">' +
        '<div class="brand-line">Chandni Silk Mills</div>' +
        "<h2>Thanks for browsing</h2>" +
        "<p>You've seen all " + TOTAL + " designs. Book a video call below or browse again anytime.</p>" +
        '<button class="back-to-grid" type="button">← Back to catalog</button>' +
      "</div>";
    poster.querySelector(".back-to-grid").addEventListener("click", closeDetail);
    slideArea.appendChild(poster);
  }
  buildSlides();

  // Track which slide is active (one slide per viewport thanks to snap).
  const slides = Array.from(slideArea.children);
  const io = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (e.isIntersecting) {
        const idx = Number(e.target.dataset.index);
        if (idx !== active) {
          if (zoomedIdx >= 0 && zoomedIdx !== idx) resetZoom(true); // leaving a zoomed slide
          active = idx; update();
        }
      }
    }
  }, { threshold: 0.5 });
  slides.forEach((s) => io.observe(s));

  // Upgrade the active slide's mid-res image to full-res (webp/) in the background.
  const upgraded = new Set();
  function upgradeToFull(idx) {
    if (idx === POSTER_INDEX || upgraded.has(idx)) return; // poster is already full-res at root
    const slide = slides[idx];
    const img = slide && slide.querySelector("img.full");
    if (!img) return;
    const fullUrl = webpUrl(FILES[idx]);
    if (img.getAttribute("src") === fullUrl) { upgraded.add(idx); return; }
    const up = new Image();
    up.onload = () => { img.src = fullUrl; upgraded.add(idx); };
    up.onerror = () => { upgraded.add(idx); };
    up.src = fullUrl;
  }

  // ============================================================
  // OPEN / CLOSE
  // ============================================================
  function openDetail(i) {
    active = Math.max(0, Math.min(POSTER_INDEX, i));
    gridScroll = window.scrollY;
    detail.classList.add("open");
    document.body.style.overflow = "hidden";
    const top = active * slideArea.clientHeight;
    slideArea.scrollTop = top; // jump straight to the tapped slide
    requestAnimationFrame(() => { slideArea.scrollTop = top; });
    update();
  }
  function closeDetail() {
    resetZoom(true);
    detail.classList.remove("open");
    document.body.style.overflow = "";
    window.scrollTo(0, gridScroll);
  }
  document.getElementById("back-btn").addEventListener("click", closeDetail);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && detail.classList.contains("open")) closeDetail();
  });

  // ============================================================
  // ZOOM: pinch / double-tap on the active slide's fabric photo.
  // Fabric buyers need to inspect weave and zari up close. While zoomed
  // (scale > 1) the gesture belongs to the image — slide scroll is frozen so
  // vertical drags pan the fabric instead of flipping designs; pinch back in
  // or double-tap to release.
  // ============================================================
  const MIN_SCALE = 1, MAX_SCALE = 4;
  let zScale = 1, zTx = 0, zTy = 0;         // current transform
  let zoomedIdx = -1;                        // which slide img is zoomed
  const zoomHint = document.querySelector(".zoom-hint");
  let hintShown = false;

  function showZoomHint() {
    if (hintShown) return;
    hintShown = true;
    if (!zoomHint) return;
    zoomHint.classList.add("show");
    setTimeout(() => zoomHint.classList.remove("show"), 2600);
  }

  function applyTransform(img, immediate) {
    img.classList.toggle("zooming", !!immediate);
    img.style.transform = "translate(" + zTx + "px," + zTy + "px) scale(" + zScale + ")";
  }

  function clampPan(img) {
    // Keep the image edges from separating from the viewport while panning.
    if (zScale <= 1) { zTx = 0; zTy = 0; return; }
    const rect = img.getBoundingClientRect();
    const maxX = Math.max(0, (rect.width * zScale - rect.width) / 2);
    const maxY = Math.max(0, (rect.height * zScale - rect.height) / 2);
    zTx = Math.max(-maxX, Math.min(maxX, zTx));
    zTy = Math.max(-maxY, Math.min(maxY, zTy));
  }

  function resetZoom(immediate) {
    if (zoomedIdx < 0) return;
    const img = slides[zoomedIdx] && slides[zoomedIdx].querySelector("img.full");
    if (!img) return;
    zScale = 1; zTx = 0; zTy = 0;
    applyTransform(img, immediate);
    slideArea.style.overflowY = "";
    zoomedIdx = -1;
  }

  function setupZoom(img, idx) {
    let lastTapT = 0, lastTapX = 0, lastTapY = 0;   // double-tap detection
    let pinchStart = null;                           // {dist, cx, cy, scale, tx, ty}
    let panStart = null;                             // pointer pan state

    const media = img.parentElement;

    function zoomTo(scale, cx, cy) {
      // Zoom around a point (viewport coords relative to img center).
      const rect = img.getBoundingClientRect();
      const ox = cx != null ? cx - (rect.left + rect.width / 2) : 0;
      const oy = cy != null ? cy - (rect.top + rect.height / 2) : 0;
      const prev = zScale;
      zScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
      if (zScale > MIN_SCALE && zoomedIdx !== idx) {
        if (zoomedIdx >= 0 && zoomedIdx !== idx) resetZoom(true); // only one zoomed at a time
        zoomedIdx = idx;
        slideArea.style.overflowY = "hidden"; // freeze snap-scroll while inspecting
      }
      // Adjust translation so the point under the fingers stays put.
      const k = zScale / prev;
      zTx = ox + (zTx - ox) * k;
      zTy = oy + (zTy - oy) * k;
      clampPan(img);
      applyTransform(img, false);
      showZoomHint();
      // Upgrade to full-res as soon as someone starts inspecting detail work.
      upgradeToFull(idx);
    }

    media.addEventListener("touchstart", (e) => {
      if (e.touches.length === 2) {
        const [a, b] = e.touches;
        pinchStart = {
          dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
          cx: (a.clientX + b.clientX) / 2,
          cy: (a.clientY + b.clientY) / 2,
          scale: zScale, tx: zTx, ty: zTy,
        };
        lastTapT = 0; // a two-finger touch cancels double-tap
        e.preventDefault();
      } else if (e.touches.length === 1 && zScale > 1) {
        const t = e.touches[0];
        panStart = { x: t.clientX - zTx, y: t.clientY - zTy };
        e.preventDefault();
      }
    }, { passive: false });

    media.addEventListener("touchmove", (e) => {
      if (pinchStart && e.touches.length === 2) {
        const [a, b] = e.touches;
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        const cx = (a.clientX + b.clientX) / 2;
        const cy = (a.clientY + b.clientY) / 2;
        const k = dist / Math.max(1, pinchStart.dist);
        zScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, pinchStart.scale * k));
        zTx = pinchStart.tx + (cx - pinchStart.cx);
        zTy = pinchStart.ty + (cy - pinchStart.cy);
        if (zScale <= MIN_SCALE) { resetZoom(false); return; }
        clampPan(img);
        applyTransform(img, true);
        if (zoomedIdx !== idx) { zoomedIdx = idx; slideArea.style.overflowY = "hidden"; }
        e.preventDefault();
      } else if (panStart && e.touches.length === 1 && zScale > 1) {
        zTx = e.touches[0].clientX - panStart.x;
        zTy = e.touches[0].clientY - panStart.y;
        clampPan(img);
        applyTransform(img, true);
        e.preventDefault();
      }
    }, { passive: false });

    media.addEventListener("touchend", () => {
      pinchStart = null;
      panStart = null;
      if (zScale <= 1.02 && zoomedIdx === idx) resetZoom(false); // pinched back out
    });

    media.addEventListener("click", (e) => {
      if (zoomedIdx !== idx || Math.abs(zScale - 1) < 0.05) return; // taps pass through when not ours
      // Double-tap toggles between 2.2x-at-point and reset.
      const now = Date.now();
      const near = Math.hypot(e.clientX - lastTapX, e.clientY - lastTapY) < 40;
      if (now - lastTapT < 320 && near) {
        if (zScale > MIN_SCALE) resetZoom(false);
        else zoomTo(2.2, e.clientX, e.clientY);
        lastTapT = 0;
        e.preventDefault();
        e.stopPropagation();
      } else {
        lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
        e.stopPropagation(); // swallow single taps that belong to the zoom layer
      }
    });

    // Desktop: drag to pan, wheel to zoom.
    media.addEventListener("mousedown", (e) => {
      if (zScale <= 1) return;
      const sx = e.clientX - zTx, sy = e.clientY - zTy;
      const move = (ev) => { zTx = ev.clientX - sx; zTy = ev.clientY - sy; clampPan(img); applyTransform(img, true); };
      const up = () => { window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
      e.preventDefault();
    });
    media.addEventListener("wheel", (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      zoomTo(zScale * (e.deltaY < 0 ? 1.12 : 0.9), e.clientX, e.clientY);
    }, { passive: false });
  }
  // Bind zoom per slide image (poster excluded).
  slides.forEach((s, i) => {
    if (i === POSTER_INDEX) return;
    const img = s.querySelector("img.full");
    if (img) setupZoom(img, i);
  });
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2000);
  }

  function update() {
    const onPoster = active === POSTER_INDEX;
    counter.textContent = onPoster ? TOTAL + " / " + TOTAL : (active + 1) + " / " + TOTAL;

    // Peek: preview the next slide. On the poster there is none.
    if (active < POSTER_INDEX) {
      const next = active + 1 === POSTER_INDEX ? LANDING : FILES[active + 1];
      peekBg.style.backgroundImage = "url('" + (next === LANDING ? urlFor(LANDING) : midUrl(next)) + "')";
      peek.style.display = "";
    } else {
      peek.style.display = "none";
    }

    // WhatsApp CTA prefilled with the current design (generic on the poster).
    const item = onPoster ? "" : FILES[active];
    const shareLink = item ? (ORIGIN + "/share?index=" + active) : "";
    const msg = encodeURIComponent(
      item
        ? "Hi Chandni Silk Mills! 👋 I saw design " + item + " (#" + (active + 1) + ") in your catalog and I'd like to book a video call to discuss it." + (shareLink ? "\n\n" + shareLink : "")
        : "Hi Chandni Silk Mills! 👋 I'd like to book a video call to discuss your catalog."
    );
    waCta.href = "https://wa.me/" + WA_NUMBER + "?text=" + msg;

    upgradeToFull(active);
    trackView(active); // design views funnel (poster index is ignored)
  }

  // Peek tap -> next slide (or back to grid from the poster's peek, which is hidden).
  peek.addEventListener("click", () => {
    if (active < POSTER_INDEX) {
      slideArea.scrollTo({ top: (active + 1) * slideArea.clientHeight, behavior: "smooth" });
    }
  });

  // Copy link to the current design (share / Meta catalog).
  copyBtn.addEventListener("click", async () => {
    if (active === POSTER_INDEX) { showToast("Welcome to Chandni Silk Mills"); return; }
    const link = urlFor(FILES[active]);
    try {
      await navigator.clipboard.writeText(link);
      showToast("Link copied");
    } catch (e) {
      const ta = document.createElement("textarea");
      ta.value = link;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      showToast("Link copied");
    }
  });

  // ============================================================
  // Engagement: daily visits, design views, hearts, WhatsApp CTA
  // ============================================================

  // ---------- Visit counter ----------
  // Counts once per browser tab session (sessionStorage key has no date, so a fresh
  // open of the catalog counts as a view; reloads in the same tab do not double-count).
  const visitEl = document.getElementById("visits-count");
  const SESSION_VISIT_KEY = "csm_visited";
  // Traffic source: utm/src param > referrer host > "direct".
  function getTrafficSource() {
    const p = new URLSearchParams(location.search);
    const u = p.get("utm_source") || p.get("src");
    if (u) return String(u).slice(0, 100);
    try { if (document.referrer) return new URL(document.referrer).hostname.slice(0, 100); } catch (e) { /* ignore */ }
    return "direct";
  }
  async function trackVisit() {
    try {
      let already = false;
      try { already = !!sessionStorage.getItem(SESSION_VISIT_KEY); } catch (e) { /* storage blocked */ }
      if (!already) {
        try { sessionStorage.setItem(SESSION_VISIT_KEY, "1"); } catch (e) { /* storage blocked */ }
        await fetch(API + "?action=addVisit", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ source: getTrafficSource() }),
        });
      }
      const r = await fetch(API + "?action=siteVisits");
      const d = await r.json();
      if (visitEl) visitEl.textContent = d.count ?? 0;
    } catch (e) {
      if (visitEl) visitEl.textContent = "–";
    }
  }

  // ---------- Design views (replaces scroll-depth funnel) ----------
  // The grid shows every design at once, so "scroll depth" no longer exists.
  // Each time a design becomes the active full-screen slide we record a view.
  // We send only {depth} (no `from`) so the server increments just that design —
  // jumping straight to #30 must not imply the visitor saw #1-29.
  // One record per design per tab session (sessionStorage key has no date, so each
  // fresh open re-tracks; reloads don't repeat).
  const VIEW_KEY = "csm_viewed_max";
  let viewedMax = Number(sessionStorage.getItem(VIEW_KEY) || 0);
  function trackView(idx) {
    if (idx >= POSTER_INDEX) return; // poster is not a product
    const depth = idx + 1;
    if (depth <= viewedMax) return;
    viewedMax = depth;
    try { sessionStorage.setItem(VIEW_KEY, String(viewedMax)); } catch (e) { /* private mode */ }
    fetch(API + "?action=reach", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ depth }),
      keepalive: true,
    }).catch(() => {});
  }

  // ---------- Hearts ----------
  const heartBtns = Array.from(slideArea.querySelectorAll(".heart"));
  const likedThisVisitor = new Set();
  const gridCells = Array.from(grid.querySelectorAll(".cell"));

  // ---------- Shortlist (persistent likes -> WhatsApp inquiry) ----------
  // The shortlist is the durable version of the session's hearts: it survives
  // reloads (localStorage), feeds the floating pill and the bottom sheet, and
  // turns browsing into an inquiry via one WhatsApp message listing all designs.
  const SHORTLIST_KEY = "csm_shortlist";
  let shortlist = [];
  try { shortlist = JSON.parse(localStorage.getItem(SHORTLIST_KEY) || "[]"); } catch (e) { shortlist = []; }
  if (!Array.isArray(shortlist)) shortlist = [];
  shortlist = shortlist.filter((s) => FILES.some((f) => stem(f) === s));
  // Seed the heart UI from the persisted shortlist so returning visitors see
  // their likes as still-liked (no heart delta is re-sent on boot).
  shortlist.forEach((s) => likedThisVisitor.add(s));

  const slPill = document.getElementById("shortlist-pill");
  const slCount = document.getElementById("sl-count");
  const slSheet = document.getElementById("shortlist-sheet");
  const slBackdrop = document.getElementById("sheet-backdrop");
  const slThumbs = document.getElementById("sl-thumbs");
  const slWaSend = document.getElementById("sl-wa-send");

  const fileIndexByStem = {};
  FILES.forEach((f, i) => { fileIndexByStem[stem(f)] = i; });

  function saveShortlist() {
    try { localStorage.setItem(SHORTLIST_KEY, JSON.stringify(shortlist)); } catch (e) { /* private mode */ }
  }

  function shortlistAdd(stemName) {
    if (!shortlist.includes(stemName)) shortlist.push(stemName);
    saveShortlist();
    renderShortlist();
  }
  function shortlistRemove(stemName) {
    shortlist = shortlist.filter((s) => s !== stemName);
    saveShortlist();
    renderShortlist();
  }

  function buildWaMessage() {
    const lines = shortlist.map((s) => {
      const i = fileIndexByStem[s];
      return "• Design #" + (i + 1) + " — " + ORIGIN + "/share?index=" + i;
    });
    return (
      "Hi Chandni Silk Mills! 👋 I shortlisted " + shortlist.length +
      (shortlist.length === 1 ? " design" : " designs") + " from your catalog:\n\n" +
      lines.join("\n") +
      "\n\nCould you share prices and availability?"
    );
  }

  function renderShortlist() {
    slCount.textContent = shortlist.length;
    slPill.classList.toggle("show", shortlist.length > 0 && !detail.classList.contains("open"));

    if (shortlist.length === 0) {
      slThumbs.innerHTML = '<div class="sl-empty">No designs yet — tap ♡ on any design you like.</div>';
      slWaSend.removeAttribute("href");
      return;
    }
    slThumbs.innerHTML = "";
    shortlist.forEach((s) => {
      const i = fileIndexByStem[s];
      if (i === undefined) return;
      const b = document.createElement("button");
      b.className = "sl-thumb";
      b.setAttribute("aria-label", "Remove design " + (i + 1) + " from shortlist");
      b.innerHTML =
        '<img src="' + midUrl(FILES[i]) + '" alt="Design ' + (i + 1) + '" loading="lazy" decoding="async">' +
        '<span class="t-num">#' + (i + 1) + "</span>" +
        '<span class="t-remove">✕</span>';
      b.addEventListener("click", () => {
        // Removing from the sheet also unlikes everywhere (grid badge + slide heart).
        setLiked(s, false);
        showToast("Design #" + (i + 1) + " removed from shortlist");
      });
      slThumbs.appendChild(b);
    });
    slWaSend.href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(buildWaMessage());
  }

  // Open / close the sheet.
  function openSheet() { renderShortlist(); slSheet.classList.add("open"); slBackdrop.classList.add("open"); }
  function closeSheet() { slSheet.classList.remove("open"); slBackdrop.classList.remove("open"); }
  slPill.addEventListener("click", openSheet);
  document.getElementById("close-sheet").addEventListener("click", closeSheet);
  slBackdrop.addEventListener("click", closeSheet);

  // Send -> log as a CTA click so the dashboard shows shortlist inquiries.
  slWaSend.addEventListener("click", () => {
    if (!shortlist.length || !slWaSend.getAttribute("href")) return;
    closeSheet();
    showToast("Opening WhatsApp…");
    fetch(API + "?action=ctaClick", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ itemId: "shortlist(" + shortlist.length + ")" }),
    }).catch(() => {});
    if (typeof fbq === "function") fbq("track", "Lead", { content_name: "shortlist", num_items: shortlist.length });
  });

  // Clear all (with one-tap undo so a mis-tap isn't destructive).
  document.getElementById("sl-clear").addEventListener("click", () => {
    if (!shortlist.length) return;
    const previous = shortlist.slice();
    shortlist.forEach((s) => setLiked(s, false));
    closeSheet();
    toast.textContent = "Shortlist cleared";
    toast.classList.add("show");
    clearTimeout(showToast._t);
    const undo = () => {
      previous.forEach((s) => { shortlistAdd(s); setLikedVisualOnly(s, true); });
      document.removeEventListener("click", undo, true);
    };
    showToast._undo = undo;
    clearTimeout(showToast._undoT);
    showToast._undoT = setTimeout(() => {
      document.removeEventListener("click", undo, true);
    }, 4000);
    document.addEventListener("click", undo, true);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2000);
  });

  async function loadHearts() {
    try {
      const r = await fetch(API + "?action=hearts");
      const d = await r.json();
      const hearts = d.hearts || {};
      heartBtns.forEach((b) => {
        const n = hearts[b.dataset.item] ?? 0;
        b.querySelector(".n").textContent = n;
      });
      gridCells.forEach((c) => {
        const n = hearts[c.dataset.item] ?? 0;
        const badge = c.querySelector(".heart-badge");
        if (n > 0) { badge.textContent = "♥ " + n; c.classList.add("show-heart"); }
      });
      markTrending(hearts);
    } catch (e) { /* keep zeros */ }
  }
  // Trending badge: 🔥 on the 3 most-hearted designs (needs >1 heart to be
  // meaningful, otherwise every design with a single like would "trend").
  function markTrending(hearts) {
    const ranked = Object.entries(hearts)
      .filter(([, n]) => n > 0)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 3);
    const minHearts = ranked.length === 3 ? Math.max(2, ranked[2][1]) : Infinity;
    gridCells.forEach((c) => {
      const isTop = ranked.some(([item]) => item === c.dataset.item) && (hearts[c.dataset.item] ?? 0) >= minHearts;
      c.classList.toggle("trending", isTop);
    });
  }

  async function sendHeart(itemId, delta) {
    try {
      await fetch(API + "?action=heart", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ itemId, delta }),
      });
    } catch (e) { /* best-effort */ }
  }
  // Visual-only like state (no server delta) — used when restoring from storage.
  function setLikedVisualOnly(stemName, liked) {
    const idx = fileIndexByStem[stemName];
    if (idx === undefined) return;
    const btn = heartBtns[idx];
    const cell = gridCells[idx];
    if (btn) btn.classList.toggle("liked", liked);
    if (cell && liked) cell.classList.add("show-heart");
    if (liked) likedThisVisitor.add(stemName); else likedThisVisitor.delete(stemName);
  }

  // Full unlike: updates UI everywhere AND removes from the persistent shortlist.
  function setLiked(stemName, liked) {
    const idx = fileIndexByStem[stemName];
    if (idx === undefined) return;
    const btn = heartBtns[idx];
    const cell = gridCells[idx];
    const badge = cell && cell.querySelector(".heart-badge");
    if (!liked) {
      likedThisVisitor.delete(stemName);
      shortlistRemove(stemName);
      if (btn) {
        btn.classList.remove("liked");
        const nEl = btn.querySelector(".n");
        const n = Math.max(0, Number(nEl.textContent) - 1);
        nEl.textContent = n;
      }
      if (badge && cell) {
        const nEl = btn ? btn.querySelector(".n") : null;
        const n = nEl ? Number(nEl.textContent) : 0;
        badge.textContent = n > 0 ? "♥ " + n : "";
        if (n <= 0) cell.classList.remove("show-heart");
      }
      sendHeart(stemName, -1);
    }
  }

  function bindHeart(btn, cell) {
    btn.addEventListener("click", () => {
      const item = btn.dataset.item;
      const liked = likedThisVisitor.has(item);
      const nEl = btn.querySelector(".n");
      const badge = cell && cell.querySelector(".heart-badge");
      if (liked) {
        setLiked(item, false);
      } else {
        likedThisVisitor.add(item);
        shortlistAdd(item); // likes persist as a WhatsApp-ready shortlist
        btn.classList.add("liked");
        const n = Number(nEl.textContent) + 1;
        nEl.textContent = n;
        if (badge) { badge.textContent = "♥ " + n; cell.classList.add("show-heart"); }
        sendHeart(item, 1);
        showToast("Added to shortlist ♥");
      }
    });
  }
  heartBtns.forEach((b, i) => bindHeart(b, gridCells[i]));
  loadHearts();

  // ---------- WhatsApp video-call CTA: Meta Pixel Lead + per-design D1 log ----------
  waCta.addEventListener("click", function () {
    const item = active > 0 && active < POSTER_INDEX ? FILES[active] : "landing";
    if (typeof fbq === "function") {
      fbq("track", "Lead", { content_name: item });
    }
    fetch(API + "?action=ctaClick", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ itemId: item }),
    }).catch(() => {});
  });

  // Boot: load designs first, then init everything
  boot();
</script>
</body>
</html>
